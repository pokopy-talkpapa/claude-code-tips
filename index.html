<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code でやってみた</title>
  <meta property="og:title" content="Claude Code でやってみた">
  <meta property="og:description" content="Claude Codeを使ってできたことをまとめています">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pokopy-talkpapa.github.io/claude-code-tips">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Meiryo", sans-serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.75;
      padding: 0 20px;
    }

    .site-header {
      max-width: 680px;
      margin: 56px auto 48px;
    }

    .site-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .site-subtitle {
      font-size: 14px;
      color: #999;
      margin-top: 6px;
    }

    .entries {
      max-width: 680px;
      margin: 0 auto 80px;
    }

    .entry {
      border-top: 1px solid #ebebeb;
      padding: 36px 0;
    }

    .entry-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .entry-emoji {
      font-size: 26px;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .entry-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.5;
    }

    .entry-meta {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      background: #f4f4f4;
      color: #888;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
    }

    .entry-summary {
      font-size: 15px;
      color: #555;
      margin-bottom: 14px;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }

    .toggle-btn:hover { color: #555; }

    .entry-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .entry-body.open {
      max-height: 12000px;
    }

    .entry-body-inner {
      margin-top: 20px;
      font-size: 15px;
      color: #333;
    }

    .body-text {
      white-space: pre-wrap;
      display: block;
    }

    .step-heading {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      display: block;
      margin-top: 4px;
    }

    .body-divider {
      border: none;
      border-top: 1px solid #ebebeb;
      margin: 20px 0;
    }

    .youtube-wrap {
      margin-top: 20px;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
    }
    .youtube-wrap iframe {
      width: 315px;
      height: 560px;
      max-width: 100%;
      border-radius: 12px;
    }

    .entry-image {
      max-height: 360px;
      max-width: 100%;
      width: auto;
      border-radius: 8px;
      margin-top: 16px;
      margin-bottom: 4px;
      border: 1px solid #eee;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .prompt-box {
      background: #f8f8f8;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 16px 16px 12px;
      margin-top: 24px;
    }

    .prompt-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .prompt-text {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Meiryo", sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      white-space: pre-wrap;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .copy-btn {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: #444; }
    .copy-btn.copied { background: #4caf50; }

    .inline-toc {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .inline-toc-label {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 6px;
    }

    .inline-toc-link {
      font-size: 14px;
      color: #555;
      text-decoration: none;
      padding: 3px 0;
      transition: color 0.15s;
    }

    .inline-toc-link:hover { color: #1a1a1a; }

    @media (max-width: 480px) {
      .site-header { margin: 36px auto 32px; }
      .entry-title { font-size: 16px; }
      .entry { padding: 28px 0; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">🤖 Claude Code でやってみた</h1>
    <p class="site-subtitle">by ぽこぴぃ</p>
  </header>
  <main class="entries" id="entries"></main>

  <script>
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
    fetch(base + 'data.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('entries');
        data.entries.forEach(entry => {
          const tags = (entry.tags || [])
            .map(t => `<span class="tag">#${esc(t)}</span>`)
            .join('');

          // [IMAGES:] マーカー処理・太字・区切り線・ステップ見出し＋記事内目次を生成
          function renderBody(text, title, entryId) {
            // 【...】見出しを事前に検出してslugを割り当て（**【...】** 形式にも対応）
            const headings = [];
            text.split('\n').forEach(line => {
              if (/^(\*\*)?【/.test(line.trim())) {
                const label = line.trim().replace(/^\*\*/, '').replace(/\*\*.*$/, '').trim();
                headings.push({ label, slug: `${entryId}-h${headings.length}` });
              }
            });

            // 記事内目次を生成
            let tocHtml = '';
            if (headings.length > 0) {
              const links = headings.map(h =>
                `<a class="inline-toc-link" href="#${esc(h.slug)}">${esc(h.label)}</a>`
              ).join('');
              tocHtml = `<div class="inline-toc"><div class="inline-toc-label">このページの内容</div>${links}</div>`;
            }

            // 本文レンダリング（見出しにアンカーIDを付与）
            let hi = 0;
            const bodyHtml = text.split(/(\[IMAGES:[^\]]+\]|\[YOUTUBE:[^\]]+\])/).map(part => {
              const mImg = part.match(/^\[IMAGES:([^\]]+)\]$/);
              if (mImg) {
                return mImg[1].split(',').map(src => {
                  const absrc = window.location.origin + base + src.trim();
                  return `<img class="entry-image" src="${esc(absrc)}" alt="${esc(title)}">`;
                }).join('');
              }
              const mYt = part.match(/^\[YOUTUBE:([^\]]+)\]$/);
              if (mYt) {
                const videoId = esc(mYt[1].trim());
                return `<div class="youtube-wrap"><iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
              }
              const lines = part.split('\n').map(line => {
                if (line.trim() === '---') return '<hr class="body-divider">';
                let escaped = esc(line);
                escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                if (/^(\*\*)?【/.test(line.trim()) && headings[hi]) {
                  const slug = headings[hi++].slug;
                  return `<span class="step-heading" id="${esc(slug)}">${escaped}</span>`;
                }
                return escaped;
              });
              return `<span class="body-text">${lines.join('\n')}</span>`;
            }).join('');

            return tocHtml + bodyHtml;
          }

          const prompt = entry.prompt
            ? `<div class="prompt-box">
                <div class="prompt-label">💬 こんな風に頼んでみた（コピーして使ってね）</div>
                <pre class="prompt-text">${esc(entry.prompt)}</pre>
                <button class="copy-btn" onclick="copyPrompt(this)">コピー</button>
               </div>`
            : '';

          const el = document.createElement('article');
          el.className = 'entry';
          el.id = entry.id;
          el.innerHTML = `
            <div class="entry-header">
              <span class="entry-emoji">${esc(entry.emoji)}</span>
              <h2 class="entry-title">${esc(entry.title)}</h2>
            </div>
            <div class="entry-meta">
              <span>${esc(entry.date)}</span>
              ${tags}
            </div>
            <div class="entry-summary">${esc(entry.summary)}</div>
            <button class="toggle-btn" onclick="toggle(this)">続きを読む ▼</button>
            <div class="entry-body">
              <div class="entry-body-inner">${renderBody(entry.body, entry.title, entry.id)}</div>
              ${prompt}
            </div>
          `;
          container.appendChild(el);
        });

        // URLにハッシュがあれば該当記事へスクロール
        if (window.location.hash) {
          const target = document.querySelector(window.location.hash);
          if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 100);
          }
        }
      })
      .catch(err => {
        const msg = 'データを読み込めませんでした。\nfetch先: ' + (window.location.origin + base + 'data.json') + '\nエラー: ' + (err && err.message ? err.message : String(err));
        document.getElementById('entries').textContent = msg;
      });

    function toggle(btn) {
      const body = btn.nextElementSibling;
      const isOpen = body.classList.toggle('open');
      btn.textContent = isOpen ? '閉じる ▲' : '続きを読む ▼';
    }

    function copyPrompt(btn) {
      const text = btn.previousElementSibling.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'コピーしました ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'コピー';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
