<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code でやってみた</title>
  <meta property="og:title" content="Claude Code でやってみた">
  <meta property="og:description" content="Claude Codeを使ってできたことをまとめています">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pokopy-talkpapa.github.io/claude-code-tips">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Meiryo", sans-serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.75;
      padding: 0 20px;
    }

    .site-header {
      max-width: 680px;
      margin: 56px auto 48px;
    }

    .site-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .site-subtitle {
      font-size: 14px;
      color: #999;
      margin-top: 6px;
    }

    .entries {
      max-width: 680px;
      margin: 0 auto 80px;
    }

    .entry {
      border-top: 1px solid #ebebeb;
      padding: 36px 0;
    }

    .entry-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .entry-emoji {
      font-size: 26px;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .entry-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.5;
    }

    .entry-meta {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      background: #f4f4f4;
      color: #888;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
    }

    .entry-summary {
      font-size: 15px;
      color: #555;
      margin-bottom: 14px;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }

    .toggle-btn:hover { color: #555; }

    .entry-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .entry-body.open {
      max-height: 3000px;
    }

    .entry-body-inner {
      margin-top: 20px;
      font-size: 15px;
      color: #333;
      white-space: pre-wrap;
    }

    .entry-image {
      width: 100%;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #eee;
    }

    @media (max-width: 480px) {
      .site-header { margin: 36px auto 32px; }
      .entry-title { font-size: 16px; }
      .entry { padding: 28px 0; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">🤖 Claude Code でやってみた</h1>
    <p class="site-subtitle">by ぽこぴぃ</p>
  </header>
  <main class="entries" id="entries"></main>

  <script>
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('entries');
        data.entries.forEach(entry => {
          const tags = (entry.tags || [])
            .map(t => `<span class="tag">#${esc(t)}</span>`)
            .join('');
          const img = entry.image
            ? `<img class="entry-image" src="${esc(entry.image)}" alt="${esc(entry.title)}">`
            : '';

          const el = document.createElement('article');
          el.className = 'entry';
          el.innerHTML = `
            <div class="entry-header">
              <span class="entry-emoji">${esc(entry.emoji)}</span>
              <h2 class="entry-title">${esc(entry.title)}</h2>
            </div>
            <div class="entry-meta">
              <span>${esc(entry.date)}</span>
              ${tags}
            </div>
            <div class="entry-summary">${esc(entry.summary)}</div>
            <button class="toggle-btn" onclick="toggle(this)">続きを読む ▼</button>
            <div class="entry-body">
              <div class="entry-body-inner">${esc(entry.body)}${img}</div>
            </div>
          `;
          container.appendChild(el);
        });
      })
      .catch(() => {
        document.getElementById('entries').textContent = 'データを読み込めませんでした。';
      });

    function toggle(btn) {
      const body = btn.nextElementSibling;
      const isOpen = body.classList.toggle('open');
      btn.textContent = isOpen ? '閉じる ▲' : '続きを読む ▼';
    }
  </script>
</body>
</html>
