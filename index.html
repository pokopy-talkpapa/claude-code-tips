<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code でやってみた</title>
  <meta property="og:title" content="Claude Code でやってみた">
  <meta property="og:description" content="Claude Codeを使ってできたことをまとめています">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pokopy-talkpapa.github.io/claude-code-tips">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Meiryo", sans-serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.75;
      padding: 0 20px;
    }

    .site-header {
      max-width: 680px;
      margin: 56px auto 48px;
    }

    .site-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .site-subtitle {
      font-size: 14px;
      color: #999;
      margin-top: 6px;
    }

    .entries {
      max-width: 680px;
      margin: 0 auto 80px;
    }

    .entry {
      border-top: 1px solid #ebebeb;
      padding: 36px 0;
    }

    .entry-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .entry-emoji {
      font-size: 26px;
      flex-shrink: 0;
      line-height: 1.3;
    }

    .entry-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1.5;
    }

    .entry-meta {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      background: #f4f4f4;
      color: #888;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
    }

    .entry-summary {
      font-size: 15px;
      color: #555;
      margin-bottom: 14px;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }

    .toggle-btn:hover { color: #555; }

    .entry-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .entry-body.open {
      max-height: 12000px;
    }

    .entry-body-inner {
      margin-top: 20px;
      font-size: 15px;
      color: #333;
    }

    .body-text {
      white-space: pre-wrap;
      display: block;
    }

    .step-heading {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      display: block;
      margin-top: 4px;
    }

    .body-divider {
      border: none;
      border-top: 1px solid #ebebeb;
      margin: 20px 0;
    }

    .entry-image {
      max-height: 360px;
      max-width: 100%;
      width: auto;
      border-radius: 8px;
      margin-top: 16px;
      margin-bottom: 4px;
      border: 1px solid #eee;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .prompt-box {
      background: #f8f8f8;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 16px 16px 12px;
      margin-top: 24px;
    }

    .prompt-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .prompt-text {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Meiryo", sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      white-space: pre-wrap;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .copy-btn {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: #444; }
    .copy-btn.copied { background: #4caf50; }

    .toc {
      max-width: 680px;
      margin: 0 auto 40px;
      border-top: 1px solid #ebebeb;
      padding-top: 24px;
    }

    .toc-title {
      font-size: 12px;
      color: #bbb;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .toc-list {
      list-style: none;
    }

    .toc-item a {
      font-size: 14px;
      color: #888;
      text-decoration: none;
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 0;
      border-bottom: none;
      transition: color 0.15s;
    }

    .toc-item a:hover { color: #1a1a1a; }

    .toc-item-emoji { font-size: 16px; flex-shrink: 0; }

    @media (max-width: 480px) {
      .site-header { margin: 36px auto 32px; }
      .entry-title { font-size: 16px; }
      .entry { padding: 28px 0; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">🤖 Claude Code でやってみた</h1>
    <p class="site-subtitle">by ぽこぴぃ</p>
  </header>
  <nav class="toc" id="toc"></nav>
  <main class="entries" id="entries"></main>

  <script>
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        // 目次を生成
        const toc = document.getElementById('toc');
        const tocList = document.createElement('ul');
        tocList.className = 'toc-list';
        data.entries.forEach(entry => {
          const li = document.createElement('li');
          li.className = 'toc-item';
          li.innerHTML = `<a href="#${esc(entry.id)}"><span class="toc-item-emoji">${esc(entry.emoji)}</span><span>${esc(entry.title)}</span></a>`;
          tocList.appendChild(li);
        });
        toc.innerHTML = '<div class="toc-title">もくじ</div>';
        toc.appendChild(tocList);

        const container = document.getElementById('entries');
        data.entries.forEach(entry => {
          const tags = (entry.tags || [])
            .map(t => `<span class="tag">#${esc(t)}</span>`)
            .join('');
          // [IMAGES:path1,path2] マーカーをテキストと画像に分割してレンダリング
          function renderBody(text, title) {
            return text.split(/(\[IMAGES:[^\]]+\])/).map(part => {
              const m = part.match(/^\[IMAGES:([^\]]+)\]$/);
              if (m) {
                return m[1].split(',').map(src =>
                  `<img class="entry-image" src="${esc(src.trim())}" alt="${esc(title)}">`
                ).join('');
              }
              // 行ごとに処理（太字・見出し・区切り線）
              const lines = part.split('\n').map(line => {
                if (line.trim() === '---') return '<hr class="body-divider">';
                let escaped = esc(line);
                escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                if (/^【/.test(line.trim())) {
                  return `<span class="step-heading">${escaped}</span>`;
                }
                return escaped;
              });
              return `<span class="body-text">${lines.join('\n')}</span>`;
            }).join('');
          }

          const prompt = entry.prompt
            ? `<div class="prompt-box">
                <div class="prompt-label">💬 こんな風に頼んでみた（コピーして使ってね）</div>
                <pre class="prompt-text">${esc(entry.prompt)}</pre>
                <button class="copy-btn" onclick="copyPrompt(this)">コピー</button>
               </div>`
            : '';

          const el = document.createElement('article');
          el.className = 'entry';
          el.id = entry.id;
          el.innerHTML = `
            <div class="entry-header">
              <span class="entry-emoji">${esc(entry.emoji)}</span>
              <h2 class="entry-title">${esc(entry.title)}</h2>
            </div>
            <div class="entry-meta">
              <span>${esc(entry.date)}</span>
              ${tags}
            </div>
            <div class="entry-summary">${esc(entry.summary)}</div>
            <button class="toggle-btn" onclick="toggle(this)">続きを読む ▼</button>
            <div class="entry-body">
              <div class="entry-body-inner">${renderBody(entry.body, entry.title)}</div>
              ${prompt}
            </div>
          `;
          container.appendChild(el);
        });
      })
      .catch(() => {
        document.getElementById('entries').textContent = 'データを読み込めませんでした。';
      });

    function toggle(btn) {
      const body = btn.nextElementSibling;
      const isOpen = body.classList.toggle('open');
      btn.textContent = isOpen ? '閉じる ▲' : '続きを読む ▼';
    }

    function copyPrompt(btn) {
      const text = btn.previousElementSibling.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'コピーしました ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'コピー';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
